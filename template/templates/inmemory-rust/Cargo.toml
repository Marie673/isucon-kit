[package]
name = "isu-mem"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
axum = "0.8"
mimalloc = "0.1"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[profile.release]
lto = "fat"
codegen-units = 1
debug = "line-tables-only"   # perf でシンボルを読むため
